# OAuth2 profile: the Full capabilities plus AUTH=XOAUTH2 and OAUTHBEARER.
# Dovecot checks a bearer token with RFC 7662 introspection at
# @INTROSPECTION_URL@ (replaced by imaptest.StartOAuth2: the fake provider of
# testutil/oauthtest on the host) and logs in the user its "email" names.
# Passwords keep working for the passwd-file users.
auth_mechanisms = plain login xoauth2 oauthbearer

passdb passwd-file {
  mechanisms_filter = plain login
}

passdb oauth2 {
  mechanisms_filter = xoauth2 oauthbearer
}

oauth2 {
  introspection_mode = post
  introspection_url = @INTROSPECTION_URL@
  username_attribute = email
  active_attribute = active
  active_value = true
}
