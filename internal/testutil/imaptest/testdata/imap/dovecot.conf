# Minimal Dovecot 2.4 config for Silo integration tests. Not for production:
# plaintext auth, no TLS, mail kept inside the (throwaway) container.
dovecot_config_version = 2.4.3
dovecot_storage_version = 2.4.3

base_dir = /run/dovecot
state_dir = /run/dovecot
log_path = /dev/stdout

protocols = imap

ssl = no
auth_allow_cleartext = yes
auth_mechanisms = plain login

mail_driver = maildir
mail_home = /tmp/home/%{user}
mail_path = /tmp/home/%{user}/mail
mail_uid = vmail
mail_gid = vmail
mail_utf8_extensions = yes
mailbox_list_utf8 = yes
imap4rev2_enable = yes

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
}

passdb passwd-file {
  passwd_file_path = /etc/dovecot/users
  default_password_scheme = plain
}

userdb static {
  fields {
    home = /tmp/home/%{user}
  }
}

# The image ships rootless defaults here (users, listeners: IMAP on 31143).
!include_try vendor.d/*.conf


!include_try /etc/dovecot/profile.conf
