# Gmail-like folder layout (plan 3.4, "Gmail IMAP before phase 5", generic
# mode): every message is in [Gmail]/All Mail (\All); INBOX and the other
# special folders hold copies (Gmail labels). Dovecot does not do this by
# itself: tests APPEND a message to both INBOX and All Mail, as Gmail shows
# it. No X-GM-EXT-1: the generic mode is what is tested.
# The default special folders of dovecot.conf lose their roles.
namespace inbox {
  mailbox Drafts {
    special_use =
    auto = no
  }
  mailbox Sent {
    special_use =
    auto = no
  }
  mailbox Trash {
    special_use =
    auto = no
  }
  mailbox Junk {
    special_use =
    auto = no
  }
  mailbox "[Gmail]/All Mail" {
    special_use = \All
    auto = subscribe
  }
  mailbox "[Gmail]/Sent Mail" {
    special_use = \Sent
    auto = subscribe
  }
  mailbox "[Gmail]/Drafts" {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox "[Gmail]/Trash" {
    special_use = \Trash
    auto = subscribe
  }
  mailbox "[Gmail]/Spam" {
    special_use = \Junk
    auto = subscribe
  }
}
