components:
  schemas:
    Account:
      additionalProperties: false
      properties:
        displayName:
          type: string
        email:
          type: string
        error:
          type:
            - string
            - "null"
        id:
          examples:
            - acc_1
          type: string
        imapHost:
          type: string
        imapPort:
          format: int64
          type: integer
        imapTls:
          enum:
            - implicit
            - starttls
            - none
          type: string
        lastSyncAt:
          format: date-time
          type:
            - string
            - "null"
        position:
          description: Order of the account among the user's accounts (0 first); account lists are sorted by it. silo-web maps /u/<n> to the n-th account.
          format: int64
          type: integer
        provider:
          enum:
            - generic
            - gmail
            - microsoft
          type: string
        sentAppend:
          description: Whether Silo copies sent messages to the Sent folder itself (servers that do not).
          type: boolean
        smtpHost:
          type: string
        smtpPort:
          format: int64
          type: integer
        smtpTls:
          enum:
            - implicit
            - starttls
            - none
          type: string
        state:
          description: Sync state; backoff means the mail server is unreachable.
          enum:
            - connecting
            - discovering
            - initial_sync
            - live
            - backoff
            - auth_failed
            - disabled
          type: string
        username:
          type: string
      required:
        - id
        - email
        - displayName
        - position
        - provider
        - username
        - imapHost
        - imapPort
        - imapTls
        - smtpHost
        - smtpPort
        - smtpTls
        - sentAppend
        - state
        - error
        - lastSyncAt
      type: object
    AccountsOutputBody:
      additionalProperties: false
      properties:
        accounts:
          items:
            $ref: "#/components/schemas/Account"
          type:
            - array
            - "null"
      required:
        - accounts
      type: object
    Address:
      additionalProperties: false
      properties:
        email:
          type: string
        name:
          type: string
      required:
        - email
        - name
      type: object
    ConnectionParams:
      additionalProperties: false
      properties:
        email:
          description: Sender address.
          maxLength: 254
          type: string
        imapHost:
          description: Defaults to the default server of the instance.
          type: string
        imapPort:
          format: int64
          maximum: 65535
          minimum: 1
          type: integer
        imapTls:
          enum:
            - implicit
            - starttls
            - none
          type: string
        password:
          maxLength: 1024
          minLength: 1
          type: string
        smtpHost:
          type: string
        smtpPort:
          format: int64
          maximum: 65535
          minimum: 1
          type: integer
        smtpTls:
          enum:
            - implicit
            - starttls
            - none
          type: string
        username:
          description: Login name; defaults to email.
          type: string
      required:
        - password
      type: object
    ContactSuggestion:
      additionalProperties: false
      properties:
        email:
          examples:
            - jan@firma.pl
          type: string
        name:
          examples:
            - Jan Kowalski
          type: string
      required:
        - email
        - name
      type: object
    ContactSuggestions:
      additionalProperties: false
      properties:
        contacts:
          items:
            $ref: "#/components/schemas/ContactSuggestion"
          maxItems: 8
          type:
            - array
            - "null"
      required:
        - contacts
      type: object
    CreateAccount:
      additionalProperties: false
      properties:
        displayName:
          maxLength: 200
          type: string
        email:
          description: Sender address.
          maxLength: 254
          type: string
        imapHost:
          description: Defaults to the default server of the instance.
          type: string
        imapPort:
          format: int64
          maximum: 65535
          minimum: 1
          type: integer
        imapTls:
          enum:
            - implicit
            - starttls
            - none
          type: string
        password:
          maxLength: 1024
          minLength: 1
          type: string
        smtpHost:
          type: string
        smtpPort:
          format: int64
          maximum: 65535
          minimum: 1
          type: integer
        smtpTls:
          enum:
            - implicit
            - starttls
            - none
          type: string
        username:
          description: Login name; defaults to email.
          type: string
      required:
        - password
      type: object
    CreateDraftBody:
      additionalProperties: false
      properties:
        accountId:
          description: Account of a new message; the active account when omitted. Ignored for replies (the account of the message replied to).
          type: string
        mode:
          description: With replyToMessageId; reply when omitted.
          enum:
            - reply
            - replyAll
            - forward
          type: string
        replyToMessageId:
          description: m_ id of the message to reply to or forward.
          type: string
      type: object
    CreateLabelBody:
      additionalProperties: false
      properties:
        accountId:
          description: Account; the active account when omitted.
          type: string
        colorBg:
          maxLength: 32
          type: string
        colorText:
          maxLength: 32
          type: string
        name:
          maxLength: 200
          minLength: 1
          type: string
        parentId:
          type: string
        type:
          description: "user: a label (IMAP keyword); folder: a server folder (CREATE)."
          enum:
            - user
            - folder
          type: string
      required:
        - name
        - type
      type: object
    Draft:
      additionalProperties: false
      properties:
        accountId:
          examples:
            - acc_1
          type: string
        attachments:
          items:
            $ref: "#/components/schemas/UploadInfo"
          type:
            - array
            - "null"
        bcc:
          items:
            $ref: "#/components/schemas/Address"
          type:
            - array
            - "null"
        bodyHtml:
          type: string
        bodyJson:
          description: Editor document (TipTap JSON) stored as given; null when never set.
        cc:
          items:
            $ref: "#/components/schemas/Address"
          type:
            - array
            - "null"
        id:
          description: Draft id; the draft's local message is messageId.
          examples:
            - d_4k2
          type: string
        inReplyToMessageId:
          description: m_ id of the message replied to or forwarded.
          type:
            - string
            - "null"
        lastSend:
          $ref: "#/components/schemas/LastSend"
          description: The last send of this draft when it failed (it is a draft again); null otherwise. Kept until the next send, so a failure is still visible after a reload.
        messageId:
          examples:
            - m_4k2
          type: string
        serverChanged:
          description: The copy in the server's Drafts folder was changed or removed by another program since Silo saved it.
          type: boolean
        subject:
          type: string
        syncedVersion:
          description: "Version saved in the Drafts folder of the mail server (0: not yet). Saves reach the server at least 30 s after the last change."
          format: int32
          type: integer
        threadId:
          examples:
            - t_8f3k2
          type: string
        to:
          items:
            $ref: "#/components/schemas/Address"
          type:
            - array
            - "null"
        updatedAt:
          format: date-time
          type: string
        version:
          description: Send it back with PUT; it grows with every save.
          format: int32
          type: integer
        warnings:
          description: "Only in the answer of POST /drafts: what the prefill could not do (quote_unavailable: the original body could not be downloaded, the quote is its snippet; attachments_unavailable: attachments of a forwarded message could not be downloaded and were left out; attachments_too_large: attachments over the attachment limit were left out)."
          items:
            enum:
              - quote_unavailable
              - attachments_unavailable
              - attachments_too_large
            type: string
          type:
            - array
            - "null"
      required:
        - id
        - accountId
        - threadId
        - messageId
        - to
        - cc
        - bcc
        - subject
        - bodyHtml
        - bodyJson
        - inReplyToMessageId
        - attachments
        - version
        - updatedAt
        - syncedVersion
        - serverChanged
        - lastSend
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    Filter:
      additionalProperties: false
      properties:
        accountId:
          examples:
            - acc_1
          type: string
        actions:
          $ref: "#/components/schemas/FilterActions"
        createdAt:
          format: date-time
          type: string
        criteria:
          description: Query in the search syntax, as written.
          examples:
            - from:newsletter@x.com has:attachment
          type: string
        criteriaNormalized:
          description: The criteria as the server parsed them (AST.String()).
          type: string
        enabled:
          type: boolean
        id:
          examples:
            - f_7
          type: string
        name:
          description: Optional name given by the user (may be empty).
          type: string
        position:
          description: 0-based order of evaluation within the account.
          format: int64
          type: integer
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - accountId
        - name
        - criteria
        - criteriaNormalized
        - actions
        - enabled
        - position
        - createdAt
        - updatedAt
      type: object
    FilterActions:
      additionalProperties: false
      properties:
        addLabelIds:
          description: l_ ids of user labels of the filter's account (IMAP keywords on the server).
          items:
            type: string
          type:
            - array
            - "null"
        archive:
          description: "Skip the inbox: -INBOX, a move to Archive on the server."
          type: boolean
        forwardTo:
          description: Send a copy to this address at once (no undo-send window); new mail only, never the account's own mail.
          format: email
          type:
            - string
            - "null"
        important:
          description: Mark as important (IMPORTANT, $Important).
          type: boolean
        markRead:
          description: Mark as read (\Seen).
          type: boolean
        star:
          description: Star (\Flagged).
          type: boolean
        trash:
          description: Move to Trash; cannot be combined with archive.
          type: boolean
      required:
        - archive
        - markRead
        - star
        - important
        - addLabelIds
        - trash
        - forwardTo
      type: object
    FilterActionsInput:
      additionalProperties: false
      properties:
        addLabelIds:
          items:
            type: string
          maxItems: 20
          type:
            - array
            - "null"
        archive:
          type: boolean
        forwardTo:
          description: "null or absent: no forward."
          maxLength: 254
          type: string
        important:
          type: boolean
        markRead:
          type: boolean
        star:
          type: boolean
        trash:
          type: boolean
      type: object
    FilterApplyResult:
      additionalProperties: false
      properties:
        jobId:
          description: The background job; filter.applied is sent when it is done.
          examples:
            - j_k2
          type: string
        matchedEstimate:
          description: Conversations the criteria match now; null when counting took too long.
          format: int64
          type:
            - integer
            - "null"
      required:
        - jobId
        - matchedEstimate
      type: object
    FilterBody:
      additionalProperties: false
      properties:
        accountId:
          description: "POST: the account (the active one when omitted). PUT: ignored, a filter keeps its account."
          type: string
        actions:
          $ref: "#/components/schemas/FilterActionsInput"
          description: At least one action.
        criteria:
          description: Query in the search syntax; 422 invalid_query as in search, 422 invalid_filter when it matches everything (only in:anywhere).
          maxLength: 1000
          minLength: 1
          type: string
        enabled:
          description: Default true.
          type: boolean
        name:
          maxLength: 100
          type: string
        position:
          description: "0-based place in the account's list (the others shift); POST: the end when omitted, PUT: unchanged when omitted. This is how filters are reordered."
          format: int64
          minimum: 0
          type: integer
      required:
        - criteria
        - actions
      type: object
    FiltersOutputBody:
      additionalProperties: false
      properties:
        filters:
          items:
            $ref: "#/components/schemas/Filter"
          type:
            - array
            - "null"
      required:
        - filters
      type: object
    Folder:
      additionalProperties: false
      properties:
        error:
          type:
            - string
            - "null"
        errorCount:
          format: int64
          type: integer
        id:
          examples:
            - f_3
          type: string
        lastSyncAt:
          format: date-time
          type:
            - string
            - "null"
        messages:
          format: int64
          type: integer
        name:
          examples:
            - INBOX
          type: string
        role:
          enum:
            - inbox
            - sent
            - drafts
            - trash
            - junk
            - archive
            - all
            - snoozed
            - user
          type: string
        specialUse:
          description: RFC 6154 attribute reported by the server, e.g. \Sent.
          type:
            - string
            - "null"
        syncMode:
          enum:
            - sync
            - ignore
          type: string
        unread:
          format: int64
          type: integer
      required:
        - id
        - name
        - role
        - specialUse
        - messages
        - unread
        - syncMode
        - lastSyncAt
        - error
        - errorCount
      type: object
    FolderChange:
      additionalProperties: false
      properties:
        id:
          examples:
            - f_3
          type: string
        role:
          description: "Manual role; wins over SPECIAL-USE and names. One folder per role. snoozed: the folder of snoozed mail (Silo creates Snoozed on the first snooze when no folder has the role)."
          enum:
            - sent
            - drafts
            - trash
            - junk
            - archive
            - all
            - snoozed
            - user
          type: string
        syncMode:
          description: ignore removes the folder from the mirror.
          enum:
            - sync
            - ignore
          type: string
      required:
        - id
      type: object
    FoldersOutputBody:
      additionalProperties: false
      properties:
        folders:
          items:
            $ref: "#/components/schemas/Folder"
          type:
            - array
            - "null"
      required:
        - folders
      type: object
    IDsBody:
      additionalProperties: false
      properties:
        ids:
          items:
            type: string
          maxItems: 1000
          minItems: 1
          type:
            - array
            - "null"
      required:
        - ids
      type: object
    Indexing:
      additionalProperties: false
      properties:
        done:
          description: Share of the account's messages whose body is downloaded and indexed; 1 when the backfill is over.
          examples:
            - 0.62
          format: double
          maximum: 1
          minimum: 0
          type: number
      required:
        - done
      type: object
    Label:
      additionalProperties: false
      properties:
        accountId:
          examples:
            - acc_1
          type: string
        colorBg:
          type:
            - string
            - "null"
        colorText:
          type:
            - string
            - "null"
        folderId:
          description: "Folder labels: the f_ id of the server folder."
          type:
            - string
            - "null"
        id:
          description: The key (INBOX, STARRED, ..., UNREAD) for system labels, l_ id otherwise.
          examples:
            - l_7
          type: string
        keywordState:
          description: "User labels only: mirrored when the label is an IMAP keyword on the server, local_only when the server keeps no keywords (or rejected them), partial when it is a keyword except in the folders of localOnlyFolders (the 26 keywords of a Dovecot maildir folder are taken): there it lives only in Silo."
          enum:
            - mirrored
            - local_only
            - partial
          type:
            - string
            - "null"
        localOnlyFolders:
          description: "User labels in state partial: the f_ ids of the folders where the label is not written as a keyword."
          items:
            type: string
          type:
            - array
            - "null"
        name:
          type: string
        parentId:
          type:
            - string
            - "null"
        position:
          format: int64
          type: integer
        showInList:
          enum:
            - show
            - hide
            - show_if_unread
          type: string
        threadsTotal:
          format: int64
          type: integer
        threadsUnread:
          format: int64
          type: integer
        type:
          enum:
            - system
            - folder
            - user
          type: string
      required:
        - id
        - accountId
        - name
        - type
        - keywordState
        - colorBg
        - colorText
        - showInList
        - parentId
        - folderId
        - position
        - threadsTotal
        - threadsUnread
      type: object
    LabelsOutputBody:
      additionalProperties: false
      properties:
        labels:
          items:
            $ref: "#/components/schemas/Label"
          type:
            - array
            - "null"
      required:
        - labels
      type: object
    LastSend:
      additionalProperties: false
      properties:
        error:
          description: "Reply of the SMTP server or the connection error; interrupted: the server restarted during delivery (the message may have left; send it again only after checking Sent)."
          type: string
        failedRecipients:
          description: Recipients refused by the SMTP server.
          items:
            type: string
          type:
            - array
            - "null"
        outboundId:
          examples:
            - ob_9
          type: string
        status:
          description: Only failed for now; a cancelled send (undo send) is not reported.
          enum:
            - failed
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - outboundId
        - status
        - error
        - failedRecipients
        - updatedAt
      type:
        - object
        - "null"
    LoginClient:
      additionalProperties: false
      properties:
        kind:
          description: "bearer: native client; the token is returned in the body and no cookie is set."
          enum:
            - cookie
            - bearer
          type: string
        name:
          description: Device name shown in the session list, e.g. "Pixel 8".
          maxLength: 100
          type: string
      required:
        - kind
      type: object
    LoginInputBody:
      additionalProperties: false
      properties:
        client:
          $ref: "#/components/schemas/LoginClient"
          description: Kind of session to open; a browser cookie session when omitted.
        email:
          description: Mailbox address (or local part, per SILO_DEFAULT_LOGIN_FORMAT).
          maxLength: 254
          minLength: 1
          type: string
        password:
          maxLength: 1024
          minLength: 1
          type: string
      required:
        - email
        - password
      type: object
    Message:
      additionalProperties: false
      properties:
        attachments:
          items:
            $ref: "#/components/schemas/MessageAttachment"
          type:
            - array
            - "null"
        bcc:
          items:
            $ref: "#/components/schemas/Address"
          type:
            - array
            - "null"
        bodyState:
          description: "headers: only the headers are in the mirror; GET /messages/{id}/html downloads the body."
          enum:
            - headers
            - full
            - deferred
            - local
          type: string
        bodyText:
          type: string
        cc:
          items:
            $ref: "#/components/schemas/Address"
          type:
            - array
            - "null"
        date:
          format: date-time
          type: string
        draftId:
          description: d_ id for GET/PUT /drafts/{id} when the message is a draft (DRAFT label; also one written in another program); null otherwise.
          examples:
            - d_1x9
          type:
            - string
            - "null"
        folder:
          $ref: "#/components/schemas/MessageFolder"
        from:
          $ref: "#/components/schemas/Address"
        hasHtml:
          description: A text/html part exists; known once the body is downloaded.
          type: boolean
        id:
          examples:
            - m_1x9
          type: string
        labelIds:
          items:
            type: string
          type:
            - array
            - "null"
        listUnsubscribe:
          type:
            - string
            - "null"
        pendingSync:
          type: boolean
        replyTo:
          $ref: "#/components/schemas/Address"
          description: Reply-To of the message; absent without one.
        snippet:
          type: string
        subject:
          type: string
        to:
          items:
            $ref: "#/components/schemas/Address"
          type:
            - array
            - "null"
      required:
        - id
        - from
        - to
        - cc
        - bcc
        - date
        - subject
        - snippet
        - labelIds
        - folder
        - bodyState
        - hasHtml
        - bodyText
        - attachments
        - listUnsubscribe
        - pendingSync
        - draftId
      type: object
    MessageAttachment:
      additionalProperties: false
      properties:
        contentType:
          type: string
        downloaded:
          description: "false: the bytes are fetched from the mail server on first download."
          type: boolean
        filename:
          type: string
        id:
          examples:
            - a_44
          type: string
        inline:
          type: boolean
        size:
          format: int64
          type: integer
        thumbnail:
          description: GET /attachments/{id}/thumbnail serves a thumbnail (png, jpeg, gif, webp); false for other types (PDF included).
          type: boolean
      required:
        - id
        - filename
        - contentType
        - size
        - inline
        - downloaded
        - thumbnail
      type: object
    MessageFolder:
      additionalProperties: false
      properties:
        id:
          examples:
            - f_3
          type: string
        name:
          type: string
        role:
          type: string
      required:
        - id
        - name
        - role
      type:
        - object
        - "null"
    Meta:
      additionalProperties: false
      properties:
        allowCustomServers:
          description: Whether users may add accounts on arbitrary IMAP/SMTP hosts.
          type: boolean
        apiVersion:
          description: Major version of the REST API.
          examples:
            - "1"
          type: string
        authMode:
          description: "How users sign in: with their mailbox credentials (imap) or Silo accounts (local)."
          enum:
            - imap
            - local
          type: string
        maxAttachmentBytes:
          description: Limit in bytes of one upload and of a sent message with its attachments (SILO_MAX_ATTACHMENT_BYTES); larger ones are 413 upload_too_large / message_too_large.
          examples:
            - 26214400
          format: int64
          type: integer
        minWebVersion:
          description: Oldest silo-web release this server supports.
          examples:
            - 0.3.0
          type: string
        serverVersion:
          description: Version of silo-server.
          examples:
            - 0.3.0
          type: string
      required:
        - serverVersion
        - apiVersion
        - minWebVersion
        - authMode
        - allowCustomServers
        - maxAttachmentBytes
      type: object
    ModifyBody:
      additionalProperties: false
      properties:
        addLabelIds:
          items:
            type: string
          maxItems: 50
          type:
            - array
            - "null"
        ids:
          description: t_ ids (threads/modify) or m_ ids (messages/modify).
          items:
            type: string
          maxItems: 1000
          minItems: 1
          type:
            - array
            - "null"
        removeLabelIds:
          items:
            type: string
          maxItems: 50
          type:
            - array
            - "null"
      required:
        - ids
      type: object
    OperationResult:
      additionalProperties: false
      properties:
        operationId:
          description: Id of the operation (undo); null when nothing had to be sent to the server.
          type:
            - string
            - "null"
        threads:
          items:
            $ref: "#/components/schemas/Thread"
          type:
            - array
            - "null"
        undoUntil:
          description: End of the undo window of folder operations; null for flag-only changes.
          format: date-time
          type:
            - string
            - "null"
      required:
        - threads
        - operationId
        - undoUntil
      type: object
    Participant:
      additionalProperties: false
      properties:
        email:
          type: string
        name:
          type: string
        unread:
          type: boolean
      required:
        - email
        - name
        - unread
      type: object
    PatchAccount:
      additionalProperties: false
      properties:
        displayName:
          maxLength: 200
          type: string
        imapPort:
          format: int64
          maximum: 65535
          minimum: 1
          type: integer
        imapTls:
          enum:
            - implicit
            - starttls
            - none
          type: string
        password:
          maxLength: 1024
          minLength: 1
          type: string
        sentAppend:
          type: boolean
        smtpPort:
          format: int64
          maximum: 65535
          minimum: 1
          type: integer
        smtpTls:
          enum:
            - implicit
            - starttls
            - none
          type: string
      type: object
    PollResult:
      additionalProperties: false
      properties:
        events:
          description: After a resync event, discard cached data and refetch.
          items:
            $ref: "#/components/schemas/PolledEvent"
          type:
            - array
            - "null"
        nextAfter:
          description: Pass as after in the next poll.
          format: int64
          type: integer
      required:
        - events
        - nextAfter
      type: object
    PolledEvent:
      additionalProperties: false
      properties:
        data:
          additionalProperties: {}
          type: object
        id:
          format: int64
          type: integer
        type:
          type: string
      required:
        - id
        - type
        - data
      type: object
    Problem:
      additionalProperties: false
      properties:
        address:
          description: "invalid_address (and validation_failed of a draft save): the refused address as given."
          type: string
        code:
          description: Stable machine-readable error code.
          type: string
        current:
          $ref: "#/components/schemas/Draft"
          description: "draft_version_conflict: the draft as saved meanwhile (as GET /drafts/{id}), so that the client needs no extra request."
        currentVersion:
          description: "draft_version_conflict: the version saved meanwhile."
          format: int32
          type: integer
        detail:
          description: Explanation specific to this occurrence.
          type: string
        errors:
          description: Individual validation errors.
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        field:
          description: "invalid_address (and validation_failed of a draft save): the recipient field of address."
          enum:
            - to
            - cc
            - bcc
          type: string
        limit:
          description: "upload_too_large, message_too_large: the limit in bytes (SILO_MAX_ATTACHMENT_BYTES)."
          format: int64
          type: integer
        size:
          description: "upload_too_large, message_too_large: size in bytes of what was refused (for an upload: the request's Content-Length when sent, including the multipart framing)."
          format: int64
          type: integer
        status:
          description: HTTP status code.
          format: int64
          type: integer
        test:
          $ref: "#/components/schemas/TestResult"
          description: Per-step result, present for account_test_failed.
        title:
          description: Short summary of the HTTP status.
          type: string
        type:
          description: URI identifying the error type.
          format: uri
          type: string
      type: object
    ProtocolResult:
      additionalProperties: false
      properties:
        ok:
          type: boolean
        steps:
          items:
            $ref: "#/components/schemas/Step"
          type:
            - array
            - "null"
      required:
        - ok
        - steps
      type: object
    PutFoldersInputBody:
      additionalProperties: false
      properties:
        folders:
          items:
            $ref: "#/components/schemas/FolderChange"
          maxItems: 1000
          type:
            - array
            - "null"
      required:
        - folders
      type: object
    Recipient:
      additionalProperties: false
      properties:
        email:
          maxLength: 254
          minLength: 3
          type: string
        name:
          maxLength: 200
          type: string
      required:
        - email
      type: object
    Resync:
      additionalProperties: false
      properties:
        mode:
          default: incremental
          description: "incremental: sync all folders now; full: also compare every flag; rebuild: drop the cache of the account and run the initial sync from scratch (labels, filters, settings, search history and local drafts stay; snoozes and labels that are local only are re-attached by Message-ID and size; user labels come back from the IMAP keywords). Refused with 409 rebuild_blocked while a send is queued or operations wait for write-back."
          enum:
            - incremental
            - full
            - rebuild
          type: string
      type: object
    SearchSuggestion:
      additionalProperties: false
      properties:
        kind:
          description: "history: a recent query; contact: from:/to:/cc:/bcc: an address; label: label:/in: a user or folder label; operator: an operator."
          enum:
            - history
            - contact
            - label
            - operator
          type: string
        label:
          description: What to show in the list.
          examples:
            - Jan Kowalski <jan@firma.pl>
          type: string
        text:
          description: The whole query after accepting the suggestion (the last token replaced); put it in the search box as is.
          examples:
            - "from:jan@firma.pl "
          type: string
      required:
        - kind
        - text
        - label
      type: object
    SearchSuggestions:
      additionalProperties: false
      properties:
        suggestions:
          items:
            $ref: "#/components/schemas/SearchSuggestion"
          type:
            - array
            - "null"
      required:
        - suggestions
      type: object
    SendDraftBody:
      additionalProperties: false
      properties:
        sendAt:
          description: "Schedule the send (at most a year ahead). Omitted or earlier than the end of the undo window: the message leaves when the window ends."
          format: date-time
          type: string
      type: object
    SendResult:
      additionalProperties: false
      properties:
        messageId:
          description: The message, labelled SCHEDULED until it is sent, then SENT.
          examples:
            - m_4k2
          type: string
        outboundId:
          description: For POST /outbound/{id}/cancel and the outbound.status events.
          examples:
            - ob_9
          type: string
        undoUntil:
          description: The message leaves at this time; until then it can be cancelled.
          format: date-time
          type: string
      required:
        - messageId
        - outboundId
        - undoUntil
      type: object
    SessionBody:
      additionalProperties: false
      properties:
        accounts:
          items:
            $ref: "#/components/schemas/Account"
          type:
            - array
            - "null"
        csrfToken:
          description: Send as X-Silo-CSRF on every mutating request (cookie sessions only).
          type: string
        settings:
          $ref: "#/components/schemas/Settings"
        token:
          description: Bearer token of a session opened with client.kind=bearer; returned once, by POST /session only.
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - user
        - csrfToken
        - settings
        - accounts
      type: object
    SessionInfo:
      additionalProperties: false
      properties:
        clientName:
          description: Device name given by a native client at sign-in; empty for browsers.
          type: string
        createdAt:
          format: date-time
          type: string
        current:
          description: Whether this is the session making the request.
          type: boolean
        expiresAt:
          format: date-time
          type: string
        id:
          examples:
            - s_3k
          type: string
        ip:
          type:
            - string
            - "null"
        kind:
          description: "cookie: browser session; bearer: native client token."
          enum:
            - cookie
            - bearer
          type: string
        lastSeenAt:
          format: date-time
          type: string
        userAgent:
          type: string
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - userAgent
        - kind
        - clientName
        - ip
        - current
      type: object
    SessionsOutputBody:
      additionalProperties: false
      properties:
        sessions:
          items:
            $ref: "#/components/schemas/SessionInfo"
          type:
            - array
            - "null"
      required:
        - sessions
      type: object
    Settings:
      additionalProperties: false
      properties:
        activeAccountId:
          description: Account shown by default; the first account when unset.
          type:
            - string
            - "null"
        conversationView:
          type: boolean
        density:
          enum:
            - default
            - comfortable
            - compact
          type: string
        desktopNotifications:
          description: Whether the user wants desktop/system notifications of new mail; each client asks the system for its own permission.
          type: boolean
        keyboardShortcutsEnabled:
          type: boolean
        signature:
          type: string
        timezone:
          description: IANA time zone name.
          examples:
            - Europe/Warsaw
          type: string
        undoSendSeconds:
          description: Delay before a sent message leaves, in seconds.
          format: int64
          type: integer
        updatedAt:
          description: Time of the last PATCH /settings; null before the first one.
          format: date-time
          type:
            - string
            - "null"
      required:
        - density
        - undoSendSeconds
        - signature
        - timezone
        - keyboardShortcutsEnabled
        - conversationView
        - activeAccountId
        - desktopNotifications
        - updatedAt
      type: object
    SettingsPatch:
      additionalProperties: false
      properties:
        activeAccountId:
          description: acc_ id of an account of the user; null clears it (the first account is then the default).
          examples:
            - acc_1
          type:
            - string
            - "null"
        conversationView:
          type: boolean
        density:
          description: default, comfortable or compact; else 422 invalid_setting.
          type: string
        desktopNotifications:
          type: boolean
        keyboardShortcutsEnabled:
          type: boolean
        signature:
          description: HTML, at most 32 KiB (else 422 invalid_setting); stored sanitized like message HTML.
          type: string
        timezone:
          description: "IANA time zone name; else 422 invalid_timezone. Used by before:/after: of search and filters and by GET /snooze/presets."
          examples:
            - Europe/Warsaw
          type: string
        undoSendSeconds:
          description: 5, 10, 20 or 30; else 422 invalid_setting. Sets undoUntil of POST /drafts/{id}/send.
          format: int64
          type: integer
      type: object
    SnoozeBody:
      additionalProperties: false
      properties:
        until:
          description: Wake time (RFC 3339), typically the until of a preset from GET /snooze/presets; at least 30 seconds and at most a year ahead, else 422 invalid_snooze.
          format: date-time
          type: string
      required:
        - until
      type: object
    SnoozePreset:
      additionalProperties: false
      properties:
        key:
          description: Stable key; clients may translate the label by it.
          enum:
            - later_today
            - tomorrow
            - this_weekend
            - next_week
          type: string
        label:
          description: English label.
          examples:
            - Tomorrow
          type: string
        until:
          description: The wake time to send to POST /threads/{id}/snooze.
          format: date-time
          type: string
      required:
        - key
        - label
        - until
      type: object
    SnoozePresets:
      additionalProperties: false
      properties:
        presets:
          items:
            $ref: "#/components/schemas/SnoozePreset"
          type:
            - array
            - "null"
        timezone:
          description: The time zone the presets were computed in (settings.timezone, UTC when unset).
          examples:
            - Europe/Warsaw
          type: string
      required:
        - timezone
        - presets
      type: object
    SnoozeResult:
      additionalProperties: false
      properties:
        operationId:
          description: Id of the operation for POST /operations/{id}/undo; null for unsnooze, which is not undoable (snooze again instead).
          type:
            - string
            - "null"
        thread:
          $ref: "#/components/schemas/Thread"
          description: "The thread after the change (list shape): SNOOZED instead of INBOX and snoozedUntil set, or back in INBOX."
        undoUntil:
          description: "End of the undo window: until then nothing reached the mail server; null for unsnooze."
          format: date-time
          type:
            - string
            - "null"
      required:
        - thread
        - operationId
        - undoUntil
      type: object
    Step:
      additionalProperties: false
      properties:
        detail:
          description: Server capabilities or the reason the stage failed.
          type: string
        ms:
          description: Duration of the stage in milliseconds.
          format: int64
          type: integer
        ok:
          type: boolean
        step:
          description: "Stage name: connect, tls, starttls, ehlo, login, auth, capability, list."
          type: string
      required:
        - step
        - ok
        - ms
      type: object
    SyncProgress:
      additionalProperties: false
      properties:
        bytesDone:
          format: int64
          type: integer
        bytesTotal:
          format: int64
          type: integer
        foldersDone:
          format: int64
          type: integer
        foldersTotal:
          format: int64
          type: integer
        messagesDone:
          format: int64
          type: integer
        messagesTotal:
          format: int64
          type: integer
        phase:
          description: "headers_recent: last 30 days of INBOX and Sent (phase A); headers: header backfill; bodies: body backfill; done."
          enum:
            - headers_recent
            - headers
            - bodies
            - done
          type: string
      required:
        - phase
        - foldersDone
        - foldersTotal
        - messagesDone
        - messagesTotal
        - bytesDone
        - bytesTotal
      type: object
    SyncStatus:
      additionalProperties: false
      properties:
        capabilities:
          items:
            type: string
          type:
            - array
            - "null"
        deadOps:
          description: Jobs of the account that failed for good.
          format: int64
          type: integer
        email:
          type: string
        error:
          type:
            - string
            - "null"
        folders:
          items:
            $ref: "#/components/schemas/Folder"
          type:
            - array
            - "null"
        id:
          examples:
            - acc_1
          type: string
        initialSync:
          $ref: "#/components/schemas/SyncProgress"
        initialSyncDoneAt:
          format: date-time
          type:
            - string
            - "null"
        keywordsSupported:
          type: boolean
        lastSyncAt:
          format: date-time
          type:
            - string
            - "null"
        missingRoles:
          description: "Roles without a folder on the server (archive: created on the first archive operation)."
          items:
            type: string
          type:
            - array
            - "null"
        pendingOps:
          description: Local operations waiting for write-back.
          format: int64
          type: integer
        state:
          enum:
            - connecting
            - discovering
            - initial_sync
            - live
            - backoff
            - auth_failed
            - disabled
          type: string
      required:
        - id
        - email
        - state
        - lastSyncAt
        - error
        - initialSync
        - initialSyncDoneAt
        - pendingOps
        - deadOps
        - capabilities
        - keywordsSupported
        - missingRoles
        - folders
      type: object
    TestResult:
      additionalProperties: false
      properties:
        imap:
          $ref: "#/components/schemas/ProtocolResult"
        smtp:
          $ref: "#/components/schemas/ProtocolResult"
      required:
        - imap
        - smtp
      type: object
    Thread:
      additionalProperties: false
      properties:
        accountId:
          examples:
            - acc_1
          type: string
        draftId:
          description: d_ id of the newest draft in the thread (a message with the DRAFT label), for opening it in compose; null without one.
          examples:
            - d_4k2
          type:
            - string
            - "null"
        hasAttachments:
          type: boolean
        id:
          examples:
            - t_8f3k2
          type: string
        labelIds:
          description: System labels (INBOX, STARRED, ..., UNREAD) and l_ ids of user/folder labels.
          items:
            type: string
          type:
            - array
            - "null"
        lastMessageAt:
          format: date-time
          type: string
        messageCount:
          format: int64
          type: integer
        outboundId:
          description: ob_ id of that send, for POST /outbound/{id}/cancel; null when scheduledAt is null.
          examples:
            - ob_3k
          type:
            - string
            - "null"
        participants:
          items:
            $ref: "#/components/schemas/Participant"
          type:
            - array
            - "null"
        pendingSync:
          description: Local changes still waiting for the mail server.
          type: boolean
        scheduledAt:
          description: "When the queued send of the thread leaves (a scheduled send, or the undo-send window): outbound send_at while the send is queued or sending and still ahead; null otherwise. The Scheduled list is GET /threads?labelId=SCHEDULED."
          format: date-time
          type:
            - string
            - "null"
        snippet:
          type: string
        snoozedUntil:
          description: Wake time of a snoozed thread (POST /threads/{id}/snooze); null when not snoozed.
          format: date-time
          type:
            - string
            - "null"
        subject:
          type: string
        unreadCount:
          format: int64
          type: integer
      required:
        - id
        - accountId
        - subject
        - snippet
        - lastMessageAt
        - messageCount
        - unreadCount
        - hasAttachments
        - labelIds
        - participants
        - snoozedUntil
        - pendingSync
        - draftId
        - scheduledAt
        - outboundId
      type: object
    ThreadDetail:
      additionalProperties: false
      properties:
        accountId:
          type: string
        id:
          examples:
            - t_8f3k2
          type: string
        labelIds:
          items:
            type: string
          type:
            - array
            - "null"
        messages:
          items:
            $ref: "#/components/schemas/Message"
          type:
            - array
            - "null"
        outboundId:
          description: "As in the thread list: ob_ id of that send, for POST /outbound/{id}/cancel."
          type:
            - string
            - "null"
        scheduledAt:
          description: "As in the thread list: when the queued send of the thread leaves; null otherwise."
          format: date-time
          type:
            - string
            - "null"
        snoozedUntil:
          description: As in the thread list.
          format: date-time
          type:
            - string
            - "null"
        subject:
          type: string
      required:
        - id
        - accountId
        - subject
        - labelIds
        - snoozedUntil
        - scheduledAt
        - outboundId
        - messages
      type: object
    ThreadList:
      additionalProperties: false
      properties:
        approximate:
          description: "Set (true) when a search hit its time limit (3 s): the page is empty and may be retried with a narrower query. Absent otherwise."
          type: boolean
        indexing:
          $ref: "#/components/schemas/Indexing"
          description: "Present with q only: how much of the account's mail has its body indexed; results may miss words of bodies not downloaded yet."
        nextCursor:
          description: Opaque; pass it as cursor for the next page. null on the last page.
          type:
            - string
            - "null"
        resultSizeEstimate:
          description: Threads in the view (exact for a label; for a search the number of matching threads, at most 2000).
          format: int64
          type: integer
        threads:
          items:
            $ref: "#/components/schemas/Thread"
          type:
            - array
            - "null"
      required:
        - threads
        - nextCursor
        - resultSizeEstimate
      type: object
    UpdateDraftBody:
      additionalProperties: false
      properties:
        attachmentIds:
          description: u_ ids of uploads to attach, inline pictures included (and the attachments a forward carries); uploads left out are detached.
          items:
            type: string
          maxItems: 100
          type:
            - array
            - "null"
        bcc:
          items:
            $ref: "#/components/schemas/Recipient"
          maxItems: 500
          type:
            - array
            - "null"
        bodyHtml:
          maxLength: 5000000
          type: string
        bodyJson:
          description: Editor document (TipTap JSON), stored as given.
        cc:
          items:
            $ref: "#/components/schemas/Recipient"
          maxItems: 500
          type:
            - array
            - "null"
        subject:
          maxLength: 998
          type: string
        syncNow:
          description: "Save the copy in the server's Drafts folder right away instead of 30 s after the last change: the last save when the compose window closes (plan 3.8 step 2)."
          type: boolean
        to:
          items:
            $ref: "#/components/schemas/Recipient"
          maxItems: 500
          type:
            - array
            - "null"
        version:
          description: Version the client edited (from the last GET/PUT); another save meanwhile is 409 draft_version_conflict.
          format: int32
          minimum: 1
          type: integer
      required:
        - version
        - to
        - subject
        - bodyHtml
      type: object
    UpdateLabelBody:
      additionalProperties: false
      properties:
        colorBg:
          description: Empty string clears the colour.
          maxLength: 32
          type: string
        colorText:
          maxLength: 32
          type: string
        name:
          description: User labels only.
          maxLength: 200
          minLength: 1
          type: string
        parentId:
          description: "User labels only: l_ id of the new parent (a user label of the same account, not the label itself or one of its descendants; else 422 invalid_parent); null moves the label to the top level. The name and the IMAP keyword do not change (the keyword comes from the leaf name)."
          examples:
            - l_12
          type:
            - string
            - "null"
        showInList:
          enum:
            - show
            - hide
            - show_if_unread
          type: string
      type: object
    UploadInfo:
      additionalProperties: false
      properties:
        cid:
          description: "Content-ID of an inline upload, generated by the server (without <>): put it in the HTML as <img src=\"cid:<cid>\">. null for other uploads."
          examples:
            - 5f0c1e2d9a8b4c7d6e5f4a3b2c1d0e9f@silo
          type:
            - string
            - "null"
        contentType:
          examples:
            - application/pdf
          type: string
        filename:
          examples:
            - umowa.pdf
          type: string
        id:
          examples:
            - u_91
          type: string
        inline:
          description: A picture shown in the body as cid:<cid> (pasted into the editor); it is sent in multipart/related. An inline upload the body does not refer to is sent as a plain attachment.
          type: boolean
        size:
          examples:
            - 1203311
          format: int64
          type: integer
        thumbnail:
          description: GET /attachments/{id}/thumbnail serves a thumbnail (png, jpeg, gif, webp).
          type: boolean
      required:
        - id
        - filename
        - size
        - contentType
        - inline
        - cid
        - thumbnail
      type: object
    User:
      additionalProperties: false
      properties:
        displayName:
          type: string
        email:
          type: string
        id:
          examples:
            - u_1
          type: string
        isAdmin:
          type: boolean
      required:
        - id
        - email
        - displayName
        - isAdmin
      type: object
  securitySchemes:
    bearerAuth:
      description: Session token returned by POST /session with client.kind=bearer (native clients). No cookie and no CSRF header are used with it.
      scheme: bearer
      type: http
    cookieAuth:
      description: Session cookie set by POST /session.
      in: cookie
      name: silo_session
      type: apiKey
    csrfHeader:
      description: csrfToken of the session; required on mutating requests.
      in: header
      name: X-Silo-CSRF
      type: apiKey
info:
  description: REST API of silo-server, the SiloPost backend.
  title: SiloPost API
  version: "1"
openapi: 3.1.0
paths:
  /accounts:
    get:
      operationId: listAccounts
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountsOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: List the accounts of the user with their sync state
      tags:
        - accounts
    post:
      description: Runs the connection test first; a failure answers 422 account_test_failed with the steps in `test`.
      operationId: createAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccount"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - cookieAuth: []
          csrfHeader: []
        - bearerAuth: []
      summary: Add an account
      tags:
        - accounts
  /accounts/test:
    post:
      description: "Runs IMAP (connect, tls, login, capability, list) and SMTP (connect, ehlo, starttls, auth) checks and reports each step; nothing is sent or stored. The response is 200 even when a step fails: inspect `ok` per protocol."
      operationId: testAccount
      requestBody:
