          in: query
          name: labelId
          schema:
            description: "System key (INBOX, ...) or l_ id. Omitted: all mail except threads entirely in Trash or Spam."
            type: string
        - description: Full-text query (plain words; no operators yet).
          explode: false
          in: query
          name: q
          schema:
            description: Full-text query (plain words; no operators yet).
            maxLength: 500
            type: string
        - explode: false
          in: query
          name: cursor
          schema:
            type: string
