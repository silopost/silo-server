components:
  schemas:
    Account:
      additionalProperties: false
      properties:
        displayName:
          type: string
        email:
          type: string
        error:
          type:
            - string
            - "null"
        id:
          examples:
            - acc_1
          type: string
        imapHost:
          type: string
        imapPort:
          format: int64
          type: integer
        imapTls:
          enum:
            - implicit
            - starttls
            - none
          type: string
        lastSyncAt:
          format: date-time
          type:
            - string
            - "null"
        provider:
          enum:
            - generic
            - gmail
            - microsoft
          type: string
        sentAppend:
          description: Whether Silo copies sent messages to the Sent folder itself (servers that do not).
          type: boolean
        smtpHost:
          type: string
        smtpPort:
          format: int64
          type: integer
        smtpTls:
          enum:
            - implicit
            - starttls
            - none
          type: string
        state:
          description: Sync state; backoff means the mail server is unreachable.
          enum:
            - connecting
            - discovering
            - initial_sync
            - live
            - backoff
            - auth_failed
            - disabled
          type: string
        username:
          type: string
      required:
        - id
        - email
        - displayName
        - provider
        - username
        - imapHost
        - imapPort
        - imapTls
        - smtpHost
        - smtpPort
        - smtpTls
        - sentAppend
        - state
        - error
        - lastSyncAt
      type: object
    AccountsOutputBody:
      additionalProperties: false
      properties:
        accounts:
          items:
            $ref: "#/components/schemas/Account"
          type:
            - array
            - "null"
      required:
        - accounts
      type: object
    Address:
      additionalProperties: false
      properties:
        email:
          type: string
        name:
          type: string
      required:
        - email
        - name
      type: object
    ConnectionParams:
      additionalProperties: false
      properties:
        email:
          description: Sender address.
          maxLength: 254
          type: string
        imapHost:
          description: Defaults to the default server of the instance.
          type: string
        imapPort:
          format: int64
          maximum: 65535
          minimum: 1
          type: integer
        imapTls:
          enum:
            - implicit
            - starttls
            - none
          type: string
        password:
          maxLength: 1024
          minLength: 1
          type: string
        smtpHost:
          type: string
        smtpPort:
          format: int64
          maximum: 65535
          minimum: 1
          type: integer
        smtpTls:
          enum:
            - implicit
            - starttls
            - none
          type: string
        username:
          description: Login name; defaults to email.
          type: string
      required:
        - password
      type: object
    CreateAccount:
      additionalProperties: false
      properties:
        displayName:
          maxLength: 200
          type: string
        email:
          description: Sender address.
          maxLength: 254
          type: string
        imapHost:
          description: Defaults to the default server of the instance.
          type: string
        imapPort:
          format: int64
          maximum: 65535
          minimum: 1
          type: integer
        imapTls:
          enum:
            - implicit
            - starttls
            - none
          type: string
        password:
          maxLength: 1024
          minLength: 1
          type: string
        smtpHost:
          type: string
        smtpPort:
          format: int64
          maximum: 65535
          minimum: 1
          type: integer
        smtpTls:
          enum:
            - implicit
            - starttls
            - none
          type: string
        username:
          description: Login name; defaults to email.
          type: string
      required:
        - password
      type: object
    CreateLabelBody:
      additionalProperties: false
      properties:
        accountId:
          description: Account; the active account when omitted.
          type: string
        colorBg:
          maxLength: 32
          type: string
        colorText:
          maxLength: 32
          type: string
        name:
          maxLength: 200
          minLength: 1
          type: string
        parentId:
          type: string
        type:
          description: "user: a label (IMAP keyword); folder: a server folder (CREATE)."
          enum:
            - user
            - folder
          type: string
      required:
        - name
        - type
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    Folder:
      additionalProperties: false
      properties:
        error:
          type:
            - string
            - "null"
        errorCount:
          format: int64
          type: integer
        id:
          examples:
            - f_3
          type: string
        lastSyncAt:
          format: date-time
          type:
            - string
            - "null"
        messages:
          format: int64
          type: integer
        name:
          examples:
            - INBOX
          type: string
        role:
          enum:
            - inbox
            - sent
            - drafts
            - trash
            - junk
            - archive
            - all
            - user
          type: string
        specialUse:
          description: RFC 6154 attribute reported by the server, e.g. \Sent.
          type:
            - string
            - "null"
        syncMode:
          enum:
            - sync
            - ignore
          type: string
        unread:
          format: int64
          type: integer
      required:
        - id
        - name
        - role
        - specialUse
        - messages
        - unread
        - syncMode
        - lastSyncAt
        - error
        - errorCount
      type: object
    FolderChange:
      additionalProperties: false
      properties:
        id:
          examples:
            - f_3
          type: string
        role:
          description: Manual role; wins over SPECIAL-USE and names. One folder per role.
          enum:
            - sent
            - drafts
            - trash
            - junk
            - archive
            - all
            - user
          type: string
        syncMode:
          description: ignore removes the folder from the mirror.
          enum:
            - sync
            - ignore
          type: string
      required:
        - id
      type: object
    FoldersOutputBody:
      additionalProperties: false
      properties:
        folders:
          items:
            $ref: "#/components/schemas/Folder"
          type:
            - array
            - "null"
      required:
        - folders
      type: object
    IDsBody:
      additionalProperties: false
      properties:
        ids:
          items:
            type: string
          maxItems: 1000
          minItems: 1
          type:
            - array
            - "null"
      required:
        - ids
      type: object
    Label:
      additionalProperties: false
      properties:
        accountId:
          examples:
            - acc_1
          type: string
        colorBg:
          type:
            - string
            - "null"
        colorText:
          type:
            - string
            - "null"
        folderId:
          description: "Folder labels: the f_ id of the server folder."
          type:
            - string
            - "null"
        id:
          description: The key (INBOX, STARRED, ..., UNREAD) for system labels, l_ id otherwise.
          examples:
            - l_7
          type: string
        keywordState:
          description: "User labels only: mirrored when the label is an IMAP keyword on the server, local_only when the server keeps no keywords."
          enum:
            - mirrored
            - local_only
          type:
            - string
            - "null"
        name:
          type: string
        parentId:
          type:
            - string
            - "null"
        position:
          format: int64
          type: integer
        showInList:
          enum:
            - show
            - hide
            - show_if_unread
          type: string
        threadsTotal:
          format: int64
          type: integer
        threadsUnread:
          format: int64
          type: integer
        type:
          enum:
            - system
            - folder
            - user
          type: string
      required:
        - id
        - accountId
        - name
        - type
        - keywordState
        - colorBg
        - colorText
        - showInList
        - parentId
        - folderId
        - position
        - threadsTotal
        - threadsUnread
      type: object
    LabelsOutputBody:
      additionalProperties: false
      properties:
        labels:
          items:
            $ref: "#/components/schemas/Label"
          type:
            - array
            - "null"
      required:
        - labels
      type: object
    LoginClient:
      additionalProperties: false
      properties:
        kind:
          description: "bearer: native client; the token is returned in the body and no cookie is set."
          enum:
            - cookie
            - bearer
          type: string
        name:
          description: Device name shown in the session list, e.g. "Pixel 8".
          maxLength: 100
          type: string
      required:
        - kind
      type: object
    LoginInputBody:
      additionalProperties: false
      properties:
        client:
          $ref: "#/components/schemas/LoginClient"
          description: Kind of session to open; a browser cookie session when omitted.
        email:
          description: Mailbox address (or local part, per SILO_DEFAULT_LOGIN_FORMAT).
          maxLength: 254
          minLength: 1
          type: string
        password:
          maxLength: 1024
          minLength: 1
          type: string
      required:
        - email
        - password
      type: object
    Message:
      additionalProperties: false
      properties:
        attachments:
          items:
            $ref: "#/components/schemas/MessageAttachment"
          type:
            - array
            - "null"
        bcc:
          items:
            $ref: "#/components/schemas/Address"
          type:
            - array
            - "null"
        bodyState:
          description: "headers: only the headers are in the mirror; GET /messages/{id}/html downloads the body."
          enum:
            - headers
            - full
            - deferred
            - local
          type: string
        bodyText:
          type: string
        cc:
          items:
            $ref: "#/components/schemas/Address"
          type:
            - array
            - "null"
        date:
          format: date-time
          type: string
        folder:
          $ref: "#/components/schemas/MessageFolder"
        from:
          $ref: "#/components/schemas/Address"
        hasHtml:
          description: A text/html part exists; known once the body is downloaded.
          type: boolean
        id:
          examples:
            - m_1x9
          type: string
        labelIds:
          items:
            type: string
          type:
            - array
            - "null"
        listUnsubscribe:
          type:
            - string
            - "null"
        pendingSync:
          type: boolean
        replyTo:
          $ref: "#/components/schemas/Address"
        snippet:
          type: string
        subject:
          type: string
        to:
          items:
            $ref: "#/components/schemas/Address"
          type:
            - array
            - "null"
      required:
        - id
        - from
        - to
        - cc
        - bcc
        - replyTo
        - date
        - subject
        - snippet
        - labelIds
        - folder
        - bodyState
        - hasHtml
        - bodyText
        - attachments
        - listUnsubscribe
        - pendingSync
      type: object
    MessageAttachment:
      additionalProperties: false
      properties:
        contentType:
          type: string
        downloaded:
          description: "false: the bytes are fetched from the mail server on first download."
          type: boolean
        filename:
          type: string
        id:
          examples:
            - a_44
          type: string
        inline:
          type: boolean
        size:
          format: int64
          type: integer
      required:
        - id
        - filename
        - contentType
        - size
        - inline
        - downloaded
      type: object
    MessageFolder:
      additionalProperties: false
      properties:
        id:
          examples:
            - f_3
          type: string
        name:
          type: string
        role:
          type: string
      required:
        - id
        - name
        - role
      type: object
    Meta:
      additionalProperties: false
      properties:
        allowCustomServers:
          description: Whether users may add accounts on arbitrary IMAP/SMTP hosts.
          type: boolean
        apiVersion:
          description: Major version of the REST API.
          examples:
            - "1"
          type: string
        authMode:
          description: "How users sign in: with their mailbox credentials (imap) or Silo accounts (local)."
          enum:
            - imap
            - local
          type: string
        minWebVersion:
          description: Oldest silo-web release this server supports.
          examples:
            - 0.3.0
          type: string
        serverVersion:
          description: Version of silo-server.
          examples:
            - 0.3.0
          type: string
      required:
        - serverVersion
        - apiVersion
        - minWebVersion
        - authMode
        - allowCustomServers
      type: object
    ModifyBody:
      additionalProperties: false
      properties:
        addLabelIds:
          items:
            type: string
          maxItems: 50
          type:
            - array
            - "null"
        ids:
          description: t_ ids (threads/modify) or m_ ids (messages/modify).
          items:
            type: string
          maxItems: 1000
          minItems: 1
          type:
            - array
            - "null"
        removeLabelIds:
          items:
            type: string
          maxItems: 50
          type:
            - array
            - "null"
      required:
        - ids
      type: object
    OperationResult:
      additionalProperties: false
      properties:
        operationId:
          description: Id of the operation (undo); null when nothing had to be sent to the server.
          type:
            - string
            - "null"
        threads:
          items:
            $ref: "#/components/schemas/Thread"
          type:
            - array
            - "null"
        undoUntil:
          description: End of the undo window of folder operations; null for flag-only changes.
          format: date-time
          type:
            - string
            - "null"
      required:
        - threads
        - operationId
        - undoUntil
      type: object
    Participant:
      additionalProperties: false
      properties:
        email:
          type: string
        name:
          type: string
        unread:
          type: boolean
      required:
        - email
        - name
        - unread
      type: object
    PatchAccount:
      additionalProperties: false
      properties:
        displayName:
          maxLength: 200
          type: string
        imapPort:
          format: int64
          maximum: 65535
          minimum: 1
          type: integer
        imapTls:
          enum:
            - implicit
            - starttls
            - none
          type: string
        password:
          maxLength: 1024
          minLength: 1
          type: string
        sentAppend:
          type: boolean
        smtpPort:
          format: int64
          maximum: 65535
          minimum: 1
          type: integer
        smtpTls:
          enum:
            - implicit
            - starttls
            - none
          type: string
      type: object
    PollResult:
      additionalProperties: false
      properties:
        events:
          description: After a resync event, discard cached data and refetch.
          items:
            $ref: "#/components/schemas/PolledEvent"
          type:
            - array
            - "null"
        nextAfter:
          description: Pass as after in the next poll.
          format: int64
          type: integer
      required:
        - events
        - nextAfter
      type: object
    PolledEvent:
      additionalProperties: false
      properties:
        data:
          additionalProperties: {}
          type: object
        id:
          format: int64
          type: integer
        type:
          type: string
      required:
        - id
        - type
        - data
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: Stable machine-readable error code.
          type: string
        detail:
          description: Explanation specific to this occurrence.
          type: string
        errors:
          description: Individual validation errors.
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        status:
          description: HTTP status code.
          format: int64
          type: integer
        test:
          $ref: "#/components/schemas/TestResult"
          description: Per-step result, present for account_test_failed.
        title:
          description: Short summary of the HTTP status.
          type: string
        type:
          description: URI identifying the error type.
          format: uri
          type: string
      type: object
    ProtocolResult:
      additionalProperties: false
      properties:
        ok:
          type: boolean
        steps:
          items:
            $ref: "#/components/schemas/Step"
          type:
            - array
            - "null"
      required:
        - ok
        - steps
      type: object
    PutFoldersInputBody:
      additionalProperties: false
      properties:
        folders:
          items:
            $ref: "#/components/schemas/FolderChange"
          maxItems: 1000
          type:
            - array
            - "null"
      required:
        - folders
      type: object
    Resync:
      additionalProperties: false
      properties:
        mode:
          default: incremental
          description: "incremental: sync all folders now; full: also compare every flag; rebuild: drop and rebuild the cache (not implemented yet, 501)."
          enum:
            - incremental
            - full
            - rebuild
          type: string
      type: object
    SessionBody:
      additionalProperties: false
      properties:
        accounts:
          items:
            $ref: "#/components/schemas/Account"
          type:
            - array
            - "null"
        csrfToken:
          description: Send as X-Silo-CSRF on every mutating request (cookie sessions only).
          type: string
        settings:
          $ref: "#/components/schemas/Settings"
        token:
          description: Bearer token of a session opened with client.kind=bearer; returned once, by POST /session only.
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - user
        - csrfToken
        - settings
        - accounts
      type: object
    SessionInfo:
      additionalProperties: false
      properties:
        clientName:
          description: Device name given by a native client at sign-in; empty for browsers.
          type: string
        createdAt:
          format: date-time
          type: string
        current:
          description: Whether this is the session making the request.
          type: boolean
        expiresAt:
          format: date-time
          type: string
        id:
          examples:
            - s_3k
          type: string
        ip:
          type:
            - string
            - "null"
        kind:
          description: "cookie: browser session; bearer: native client token."
          enum:
            - cookie
            - bearer
          type: string
        lastSeenAt:
          format: date-time
          type: string
        userAgent:
          type: string
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
        - userAgent
        - kind
        - clientName
        - ip
        - current
      type: object
    SessionsOutputBody:
      additionalProperties: false
      properties:
        sessions:
          items:
            $ref: "#/components/schemas/SessionInfo"
          type:
            - array
            - "null"
      required:
        - sessions
      type: object
    Settings:
      additionalProperties: false
      properties:
        activeAccountId:
          description: Account shown by default; the first account when unset.
          type:
            - string
            - "null"
        conversationView:
          type: boolean
        density:
          enum:
            - default
            - comfortable
            - compact
          type: string
        keyboardShortcutsEnabled:
          type: boolean
        signature:
          type: string
        timezone:
          description: IANA time zone name.
          examples:
            - Europe/Warsaw
          type: string
        undoSendSeconds:
          description: Delay before a sent message leaves, in seconds.
          format: int64
          type: integer
      required:
        - density
        - undoSendSeconds
        - signature
        - timezone
        - keyboardShortcutsEnabled
        - conversationView
        - activeAccountId
      type: object
    Step:
      additionalProperties: false
      properties:
        detail:
          description: Server capabilities or the reason the stage failed.
          type: string
        ms:
          description: Duration of the stage in milliseconds.
          format: int64
          type: integer
        ok:
          type: boolean
        step:
          description: "Stage name: connect, tls, starttls, ehlo, login, auth, capability, list."
          type: string
      required:
        - step
        - ok
        - ms
      type: object
    SyncProgress:
      additionalProperties: false
      properties:
        bytesDone:
          format: int64
          type: integer
        bytesTotal:
          format: int64
          type: integer
        foldersDone:
          format: int64
          type: integer
        foldersTotal:
          format: int64
          type: integer
        messagesDone:
          format: int64
          type: integer
        messagesTotal:
          format: int64
          type: integer
        phase:
          description: "headers_recent: last 30 days of INBOX and Sent (phase A); headers: header backfill; bodies: body backfill; done."
          enum:
            - headers_recent
            - headers
            - bodies
            - done
          type: string
      required:
        - phase
        - foldersDone
        - foldersTotal
        - messagesDone
        - messagesTotal
        - bytesDone
        - bytesTotal
      type: object
    SyncStatus:
      additionalProperties: false
      properties:
        capabilities:
          items:
            type: string
          type:
            - array
            - "null"
        deadOps:
          description: Jobs of the account that failed for good.
          format: int64
          type: integer
        email:
          type: string
        error:
          type:
            - string
            - "null"
        folders:
          items:
            $ref: "#/components/schemas/Folder"
          type:
            - array
            - "null"
        id:
          examples:
            - acc_1
          type: string
        initialSync:
          $ref: "#/components/schemas/SyncProgress"
        initialSyncDoneAt:
          format: date-time
          type:
            - string
            - "null"
        keywordsSupported:
          type: boolean
        lastSyncAt:
          format: date-time
          type:
            - string
            - "null"
        missingRoles:
          description: "Roles without a folder on the server (archive: created on the first archive operation)."
          items:
            type: string
          type:
            - array
            - "null"
        pendingOps:
          description: Local operations waiting for write-back.
          format: int64
          type: integer
        state:
          enum:
            - connecting
            - discovering
            - initial_sync
            - live
            - backoff
            - auth_failed
            - disabled
          type: string
      required:
        - id
        - email
        - state
        - lastSyncAt
        - error
        - initialSync
        - initialSyncDoneAt
        - pendingOps
        - deadOps
        - capabilities
        - keywordsSupported
        - missingRoles
        - folders
      type: object
    TestResult:
      additionalProperties: false
      properties:
        imap:
          $ref: "#/components/schemas/ProtocolResult"
        smtp:
          $ref: "#/components/schemas/ProtocolResult"
      required:
        - imap
        - smtp
      type: object
    Thread:
      additionalProperties: false
      properties:
        accountId:
          examples:
            - acc_1
          type: string
        hasAttachments:
          type: boolean
        id:
          examples:
            - t_8f3k2
          type: string
        labelIds:
          description: System labels (INBOX, STARRED, ..., UNREAD) and l_ ids of user/folder labels.
          items:
            type: string
          type:
            - array
            - "null"
        lastMessageAt:
          format: date-time
          type: string
        messageCount:
          format: int64
          type: integer
        participants:
          items:
            $ref: "#/components/schemas/Participant"
          type:
            - array
            - "null"
        pendingSync:
          description: Local changes still waiting for the mail server.
          type: boolean
        snippet:
          type: string
        snoozedUntil:
          format: date-time
          type:
            - string
            - "null"
        subject:
          type: string
        unreadCount:
          format: int64
          type: integer
      required:
        - id
        - accountId
        - subject
        - snippet
        - lastMessageAt
        - messageCount
        - unreadCount
        - hasAttachments
        - labelIds
        - participants
        - snoozedUntil
        - pendingSync
      type: object
    ThreadDetail:
      additionalProperties: false
      properties:
        accountId:
          type: string
        id:
          examples:
            - t_8f3k2
          type: string
        labelIds:
          items:
            type: string
          type:
            - array
            - "null"
        messages:
          items:
            $ref: "#/components/schemas/Message"
          type:
            - array
            - "null"
        subject:
          type: string
      required:
        - id
        - accountId
        - subject
        - labelIds
        - messages
      type: object
    ThreadList:
      additionalProperties: false
      properties:
        nextCursor:
          description: Opaque; pass it as cursor for the next page. null on the last page.
          type:
            - string
            - "null"
        resultSizeEstimate:
          description: Threads in the view (exact for a label, an estimate otherwise).
          format: int64
          type: integer
        threads:
          items:
            $ref: "#/components/schemas/Thread"
          type:
            - array
            - "null"
      required:
        - threads
        - nextCursor
        - resultSizeEstimate
      type: object
    UpdateLabelBody:
      additionalProperties: false
      properties:
        colorBg:
          description: Empty string clears the colour.
          maxLength: 32
          type: string
        colorText:
          maxLength: 32
          type: string
        name:
          description: User labels only.
          maxLength: 200
          minLength: 1
          type: string
        showInList:
          enum:
            - show
            - hide
            - show_if_unread
          type: string
      type: object
    User:
      additionalProperties: false
      properties:
        displayName:
          type: string
        email:
          type: string
        id:
          examples:
            - u_1
          type: string
        isAdmin:
          type: boolean
      required:
        - id
        - email
        - displayName
        - isAdmin
      type: object
  securitySchemes:
    bearerAuth:
      description: Session token returned by POST /session with client.kind=bearer (native clients). No cookie and no CSRF header are used with it.
      scheme: bearer
      type: http
    cookieAuth:
      description: Session cookie set by POST /session.
      in: cookie
      name: silo_session
      type: apiKey
    csrfHeader:
      description: csrfToken of the session; required on mutating requests.
      in: header
      name: X-Silo-CSRF
      type: apiKey
info:
  description: REST API of silo-server, the SiloPost backend.
  title: SiloPost API
  version: "1"
openapi: 3.1.0
paths:
  /accounts:
    get:
      operationId: listAccounts
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountsOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: List the accounts of the user with their sync state
      tags:
        - accounts
    post:
      description: Runs the connection test first; a failure answers 422 account_test_failed with the steps in `test`.
      operationId: createAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccount"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - cookieAuth: []
          csrfHeader: []
        - bearerAuth: []
      summary: Add an account
      tags:
        - accounts
  /accounts/test:
    post:
      description: "Runs IMAP (connect, tls, login, capability, list) and SMTP (connect, ehlo, starttls, auth) checks and reports each step; nothing is sent or stored. The response is 200 even when a step fails: inspect `ok` per protocol."
      operationId: testAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionParams"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestResult"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - cookieAuth: []
          csrfHeader: []
        - bearerAuth: []
      summary: Test a connection without saving
      tags:
        - accounts
  /accounts/{id}:
    delete:
      description: Deletes the account and everything cached for it. The mail server is not touched.
      operationId: deleteAccount
      parameters:
        - in: path
          name: id
          required: true
          schema:
            examples:
              - acc_1
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - cookieAuth: []
          csrfHeader: []
        - bearerAuth: []
      summary: Remove an account from Silo
      tags:
        - accounts
    patch:
      operationId: updateAccount
      parameters:
        - in: path
          name: id
          required: true
          schema:
            examples:
              - acc_1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchAccount"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - cookieAuth: []
          csrfHeader: []
        - bearerAuth: []
      summary: Change account settings
      tags:
        - accounts
  /accounts/{id}/folders:
    get:
      operationId: listFolders
      parameters:
        - in: path
          name: id
          required: true
          schema:
            examples:
              - acc_1
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoldersOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: List the server folders of an account with roles and sync mode
      tags:
        - accounts
    put:
      description: Listed folders get the given role and/or sync mode; others stay unchanged. Each role except user belongs to at most one folder and INBOX cannot be changed (422 validation_failed).
      operationId: updateFolders
      parameters:
        - in: path
          name: id
          required: true
          schema:
            examples:
              - acc_1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutFoldersInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoldersOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - cookieAuth: []
          csrfHeader: []
        - bearerAuth: []
      summary: Map folder roles and choose which folders are synced
      tags:
        - accounts
  /accounts/{id}/resync:
    post:
      description: Queues the request for the account's sync worker and returns at once.
      operationId: resyncAccount
      parameters:
        - in: path
          name: id
          required: true
          schema:
            examples:
              - acc_1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Resync"
        required: true
      responses:
        "202":
          description: Accepted
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "501":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Implemented
      security:
        - cookieAuth: []
          csrfHeader: []
        - bearerAuth: []
      summary: Force a sync of the account
      tags:
        - accounts
  /accounts/{id}/sync-status:
    get:
      description: State machine, initial sync progress, pending operations, folders and their errors, and roles still missing on the server.
      operationId: getSyncStatus
      parameters:
        - in: path
          name: id
          required: true
          schema:
            examples:
              - acc_1
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStatus"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: Get the sync state of an account
      tags:
        - accounts
  /attachments/{id}:
    get:
      description: A download; with inline=1 images are shown in the browser. An attachment that was not downloaded yet is fetched from the mail server together with its message (same wait and 503 as /messages/{id}/html).
      operationId: getAttachment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Show in the browser (images only) instead of downloading.
          explode: false
          in: query
          name: inline
          schema:
            description: Show in the browser (images only) instead of downloading.
            type: boolean
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: The attachment, with its own content type
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: Attachment bytes
      tags:
        - messages
  /events:
    get:
      description: "Pushes changes of the mailbox as they are committed. After a reconnect with Last-Event-ID the missed events (24 h retained) are replayed first; an id older than the retention yields a resync event. A ': ping' comment is sent every 25 s. A client that cannot keep up is disconnected and replays on reconnect."
      operationId: streamEvents
      parameters:
        - description: "Set by EventSource on reconnect: replays the events after it."
          in: header
          name: Last-Event-ID
          schema:
            description: "Set by EventSource on reconnect: replays the events after it."
            type: string
        - description: Same as the Last-Event-ID header, for clients that cannot set headers.
          explode: false
          in: query
          name: lastEventId
          schema:
            description: Same as the Last-Event-ID header, for clients that cannot set headers.
            type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: "A Server-Sent Events stream. Each event has id (sequence number), event (type) and data (JSON); types: message.new, thread.updated, thread.deleted, thread.merged, label.counts, label.changed, operation.failed, account.status, account.sync_progress, account.error, resync. Events caused by a request that carried X-Silo-Client have origin set to that id."
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: Server-Sent Events stream
      tags:
        - events
  /events/poll:
    get:
      description: The same events as the stream, for clients whose EventSource keeps failing. An after older than the 24 h retention answers a single resync event.
      operationId: pollEvents
      parameters:
        - description: Sequence number of the last event received; 0 starts from the oldest retained event.
          explode: false
          in: query
          name: after
          schema:
            description: Sequence number of the last event received; 0 starts from the oldest retained event.
            format: int64
            minimum: 0
            type: integer
        - explode: false
          in: query
          name: limit
          schema:
            default: 200
            format: int64
            maximum: 500
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollResult"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: Events after a sequence number (fallback for /events)
      tags:
        - events
  /labels:
    get:
      description: System labels (plus the pseudo label UNREAD), folder labels and user labels, with threadsTotal and threadsUnread (threads with unread mail).
      operationId: listLabels
      parameters:
        - description: Account; the active account when omitted.
          explode: false
          in: query
          name: accountId
          schema:
            description: Account; the active account when omitted.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelsOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: List the labels of an account with thread counters
      tags:
        - labels
    post:
      description: type user creates a label locally and assigns its IMAP keyword; type folder creates the folder on the mail server (CREATE, queued) and its folder label at once.
      operationId: createLabel
      parameters:
        - in: header
          name: X-Silo-Client
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLabelBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - cookieAuth: []
          csrfHeader: []
        - bearerAuth: []
      summary: Create a label or a folder
      tags:
        - labels
  /labels/{id}:
    delete:
      description: A user label is removed and its keyword taken off the messages (queued). A folder must be empty; it is deleted on the mail server (queued) and disappears from the labels after the next discovery. System labels answer 400.
      operationId: deleteLabel
      parameters:
        - in: header
          name: X-Silo-Client
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Needed for system label keys; the active account when omitted.
          explode: false
          in: query
          name: accountId
          schema:
            description: Needed for system label keys; the active account when omitted.
            type: string
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - cookieAuth: []
          csrfHeader: []
        - bearerAuth: []
      summary: Delete a label or an empty folder
      tags:
        - labels
    patch:
      description: Renaming a user label gives it a new IMAP keyword and moves its messages to it on the server (queued). System labels and folders cannot be renamed (400).
      operationId: updateLabel
      parameters:
        - in: header
          name: X-Silo-Client
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Needed for system label keys; the active account when omitted.
          explode: false
          in: query
          name: accountId
          schema:
            description: Needed for system label keys; the active account when omitted.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLabelBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - cookieAuth: []
          csrfHeader: []
        - bearerAuth: []
      summary: Rename, recolour or hide a label
      tags:
        - labels
  /messages/modify:
    post:
      description: "Changes labels in the Gmail model: the change is visible at once (pendingSync: true) and written back to the mail server by a queued operation. Folder changes (INBOX, TRASH, SPAM, folder labels) wait for the undo window; flags (UNREAD, STARRED, IMPORTANT, user labels as keywords) are sent at once. SENT, DRAFT, SNOOZED, SCHEDULED and ARCHIVE cannot be changed directly (400)."
      operationId: modifyMessages
      parameters:
        - description: Client id, echoed as origin in the events it causes.
          in: header
          name: X-Silo-Client
          schema:
            description: Client id, echoed as origin in the events it causes.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifyBody"
        required: true
      responses:
