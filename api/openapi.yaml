      parameters:
        - description: "Set by EventSource on reconnect: replays the events after it."
          in: header
          name: Last-Event-ID
          schema:
            description: "Set by EventSource on reconnect: replays the events after it."
            type: string
        - description: Same as the Last-Event-ID header, for clients that cannot set headers.
          explode: false
          in: query
          name: lastEventId
          schema:
            description: Same as the Last-Event-ID header, for clients that cannot set headers.
            type: string
      responses:
        "200":
          content:
            text/event-stream:
