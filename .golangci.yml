version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - revive
    - gocritic
    - misspell
    - bodyclose
  settings:
    misspell:
      # Polish folder names ("Elementy wysłane", "Nowe") are data that role
      # detection and the tests match, not English typos.
      ignore-rules:
        - elementy
        - nowe
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
